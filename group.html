<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Group Invitation — 2nd Line AI</title>
<style>
  /* Where a texted group invitation lands. The invitation itself lives in
     the app (claim → Join Now → Choose Number), so this page only hands the
     token to the app, or to the store when the app is not installed. It
     reads nothing from the server: the token is the invitee's secret and
     never leaves this page except into the app's own link. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,
    Helvetica,Arial,sans-serif;color:#000;background:#fff;display:flex;
    flex-direction:column;align-items:center;min-height:100vh;
    padding:64px 20px 28px;text-align:center}
  .badge{width:92px;height:92px;border-radius:50%;background:#000;display:flex;
    align-items:center;justify-content:center}
  .badge svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:25px;font-weight:700;line-height:28px;letter-spacing:-.02em;
    margin-top:24px}
  p{color:#8C8C8C;font-size:13px;font-weight:500;line-height:20px;
    margin-top:12px;max-width:300px}
  .open{display:flex;align-items:center;justify-content:center;width:100%;
    max-width:353px;height:55px;margin-top:28px;border-radius:15px;
    background:#4120E9;color:#fff;font-size:17px;font-weight:600;
    letter-spacing:-.01em;text-decoration:none}
  .hint{margin-top:18px;font-size:13px;color:#000}
  .stores{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:14px}
  .stores a{display:inline-flex;align-items:center;gap:8px;height:40px;width:150px;
    padding:0 12px;border-radius:8px;background:#000;color:#fff;text-decoration:none;
    font-size:13px;font-weight:600;line-height:1.1;text-align:left}
  .stores a small{display:block;font-size:9px;font-weight:400;opacity:.85}
  .stores svg{width:20px;height:20px;fill:#fff;flex:none}
  .support{margin-top:auto;padding-top:28px;font-size:13px;color:#000}
  .support a{color:#000;text-decoration:none}
</style>
</head>
<body>
<div class="badge" aria-hidden="true">
  <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 13.6c2.4-.3 4.3 1.2 4.7 4"/></svg>
</div>
<h1 id="title">Group Invitation</h1>
<p id="intro">You have been invited to join a group on 2nd Line AI. Open the invitation in the app to join.</p>
<a class="open" id="open" href="#">Open in 2nd Line AI</a>
<p class="hint">Don’t have the app yet? Install it, sign in, then tap the link in your message again.</p>
<div class="stores">
  <a id="appstore" href="https://apps.apple.com/app/id6804151303" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.5-.2-2.9.9-3.6.9-.8 0-1.9-.8-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.4 0 1.9.8 3.1.8 1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.6 1.3-2.7 0 0-2.6-1-2.6-4zM14.1 5.6c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg>
    <span><small>Available on the</small>App Store</span>
  </a>
  <a id="playstore" href="https://play.google.com/store/apps/details?id=com.worksdelight.lyne" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.2 13.4 12l-9.8 9.8c-.3-.3-.5-.7-.5-1.2V3.4c0-.5.2-.9.5-1.2zm11 11 2.9 2.9-11.2 6.4c-.6.3-1.2.4-1.7.2L14.6 13.2zm0-2.4L4.6 1.3c.5-.2 1.1-.1 1.7.2l11.2 6.4-2.9 2.9zm1.2 1.2 3.5-2c.9-.5.9-1.8 0-2.3l-3.5-2L12.6 12l3.2 3.2z"/></svg>
    <span><small>GET IT ON</small>Google Play</span>
  </a>
</div>
<p class="support">Support: <a href="support.html">2nd Line AI support</a></p>
<script>
(function () {
  // The token rides ?t= (404.html forwards …/group/<token> here) or the
  // last path segment.
  function token() {
    var q = new URLSearchParams(location.search).get('t');
    if (q) { return q; }
    var parts = location.pathname.split('/').filter(Boolean);
    return parts[parts.length - 1] || '';
  }
  var t = token();
  var open = document.getElementById('open');
  if (!/^[0-9a-f]{32}$/i.test(t)) {
    document.getElementById('title').textContent = 'Link incomplete';
    document.getElementById('intro').textContent =
      'Open the full link from the message you received.';
    open.style.display = 'none';
    return;
  }
  var app = 'lyne://group/' + t;
  open.href = app;
  // One attempt on arrival; the button is there when the browser asks first
  // or the app is not installed.
  setTimeout(function () { location.href = app; }, 300);
})();
</script>
</body>
</html>
